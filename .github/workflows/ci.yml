name: ci

# 回归闸门（regression gate）—— 每次 push / PR 跑齐 tools/run_all_checks.sh：
#   全量 pytest（skills/ + tools/）+ 设计law机检（validate_skills）+ 系列独立性审计。
# 重 AI 依赖（insightface/cv2/torch/conda 模型权重）的测试在 CI 里优雅跳过——它们的脚本
# 本来就要求"缺依赖不静默当通过、报 degraded"，纯逻辑/数学部分仍被覆盖。
#
# 为什么是 push 也跑（不只 PR）：本仓库提交直推 main、且后台 factory 进程会自动 commit WIP，
# 没有 PR 评审环节，CI 是改动落到 main 后唯一的自动回归网。

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test deps
        # 只装纯轮子依赖（pytest + Pillow + numpy）；重模型依赖留给本机 conda env，
        # 对应测试在 CI 里走"缺库优雅跳过"分支。
        run: python -m pip install --upgrade pip pytest pytest-subtests Pillow numpy

      - name: Run repo-level checks
        run: bash tools/run_all_checks.sh
