name: desktop-release

# Builds the desktop-tauri app installers for macOS (.dmg/.app, universal
# Intel+Apple-Silicon) and Windows (.msi + .exe) in the cloud — the only way
# to produce a Windows installer, since Tauri can't cross-compile it from macOS.
#
# Push a tag like `desktop-v0.1.0` -> a draft GitHub Release with both OS
# installers attached. Or run manually (workflow_dispatch) -> installers land
# as downloadable build artifacts (no release).

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            rust_targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        # full checkout so sync-skills.js can copy the real skills/ into resources/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Install frontend deps
        working-directory: desktop-tauri
        run: npm ci

      - name: Build app + bundle installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-tauri
          # On a tag push: create/append a draft release. Otherwise: no release.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Anime Arsenal Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installers as artifacts (non-tag runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            desktop-tauri/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop-tauri/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            desktop-tauri/src-tauri/target/**/release/bundle/msi/*.msi
            desktop-tauri/src-tauri/target/**/release/bundle/nsis/*.exe
