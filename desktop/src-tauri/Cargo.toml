[package]
name = "anime-armory-desktop"
version = "0.1.0"
description = "Tauri desktop shell for Creation Armory, the anime-armory creative production factory"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
tiny_http = "0.12"
notify = "6"
dirs = "5"      # cross-platform home dir (HOME / USERPROFILE)
trash = "5"     # cross-platform Trash / Recycle Bin
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "anime-armory-desktop"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
