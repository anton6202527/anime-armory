appId: com.animearmory.desktop
productName: AnimeArmory
directories:
  output: release
# Native deps are handled outside electron-builder: postinstall runs
# electron-rebuild for the host (mac), and node-pty ships NAPI prebuilds for
# every platform — so skip the built-in rebuild (it breaks win cross-builds:
# node-gyp cannot cross-compile).
npmRebuild: false
files:
  - out/**
  - package.json
  # Ship node-pty's NAPI prebuilds (all platforms) instead of the host-built
  # node-gyp output: its loader prefers build/Release, and a darwin binary in
  # there would shadow the win32 prebuilds in cross-built Windows packages.
  - "!**/node_modules/node-pty/build/**"
# Bundled skills repo + public R2 Demo catalog fallback, staged by e2a's
# resource sync script.
# into ./resources. The app resolves it via process.resourcesPath/resources
# (see src/main/services/workspace.ts, demos.ts).
extraResources:
  - from: resources
    to: resources
asarUnpack:
  # Keep node-pty's JavaScript in app.asar. Its loader rewrites app.asar to
  # app.asar.unpacked for native files; unpacking the whole package makes that
  # path become app.asar.unpacked.unpacked and PTY spawn fails on macOS.
  - "**/node_modules/node-pty/prebuilds/**"
beforePack: scripts/before-pack.cjs
afterPack: scripts/after-pack.cjs
mac:
  category: public.app-category.productivity
  # electron-builder converts the 1024px source into the required ICNS set.
  icon: assets/app-icon/icon.png
  artifactName: AnimeArmory_electron_macos_${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
win:
  icon: assets/app-icon/icon.ico
  artifactName: AnimeArmory_electron_windows.${ext}
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
