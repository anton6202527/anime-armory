appId: com.animearmory.desktop
productName: AnimeArmory
directories:
  output: release
# Native deps are handled outside electron-builder: postinstall runs
# electron-rebuild for the host (mac), and node-pty ships NAPI prebuilds for
# every platform — so skip the built-in rebuild (it breaks win cross-builds:
# node-gyp cannot cross-compile).
npmRebuild: false
files:
  - out/**
  - package.json
  # Ship node-pty's NAPI prebuilds (all platforms) instead of the host-built
  # node-gyp output: its loader prefers build/Release, and a darwin binary in
  # there would shadow the win32 prebuilds in cross-built Windows packages.
  - "!**/node_modules/node-pty/build/**"
# Bundled skills repo + demo catalog, staged by tools/e2a/scripts/sync_bundle.cjs
# into ./resources. The app resolves it via process.resourcesPath/resources
# (see src/main/services/workspace.ts, demos.ts).
extraResources:
  - from: resources
    to: resources
asarUnpack:
  - "**/node_modules/node-pty/**"
mac:
  category: public.app-category.productivity
  artifactName: AnimeArmory_electron_macos_${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
win:
  artifactName: AnimeArmory_electron_windows.${ext}
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
