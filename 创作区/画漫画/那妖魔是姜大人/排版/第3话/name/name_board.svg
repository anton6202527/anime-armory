<text class="pid" x="718" y="77">P013</text>
<text class="note" x="718" y="92">信息格；对白可分两个气泡，火把和马队保持低细节。</text>
<rect x="702" y="131" width="264" height="95" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="707" y="146">P014</text>
<text class="note" x="707" y="161">闪回大格；狼妖压迫感强，但避免详细残害、内脏、儿童猎奇；不出现…</text>
<rect x="702" y="232" width="264" height="95" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="707" y="247">P015</text>
<text class="note" x="707" y="262">群像压迫大格；姜月初背影小而硬，众人跪请形成巨大的误认压力。</text>
<rect x="702" y="334" width="264" height="95" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="707" y="349">P016</text>
<text class="note" x="707" y="364">结尾大格；表面镇魔司冷脸，内心崩溃吐槽。不要直视读者；底部留黑…</text>
