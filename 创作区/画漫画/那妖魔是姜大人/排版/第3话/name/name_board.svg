<text class="pid" x="62" y="155">P002</text>
<text class="note" x="62" y="170">中大格；留一块安静黑白灰空间给旁白，情绪克制。</text>
<rect x="57" y="194" width="242" height="48" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="62" y="209">P003</text>
<text class="note" x="62" y="224">中格；求生现实感，不要过度 gore；补给物要清楚。</text>
<rect x="57" y="248" width="242" height="48" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="62" y="263">P004</text>
<text class="note" x="62" y="278">中格；制服赤纹要成为视觉焦点，避免剥衣猎奇。</text>
<rect x="46" y="302" width="264" height="72" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="51" y="317">P005</text>
<text class="note" x="51" y="332">本话造型揭示大格；黑衣赤纹是重点，但脸必须继承 CHAR_JY…</text>
<rect x="57" y="381" width="242" height="48" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="62" y="396">P006</text>
<text class="note" x="62" y="411">窄长过渡格；留旁白；孤独和冷。</text>
