<text class="note" x="390" y="92">信息格；用图形符号表现户籍/路引压力，禁止画可读文书正文。</text>
<rect x="385" y="116" width="242" height="48" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="390" y="131">P008</text>
<text class="note" x="390" y="146">安静中格；给下一格马蹄打断做节奏停顿。</text>
<rect x="374" y="170" width="264" height="72" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="379" y="185">P009</text>
<text class="note" x="379" y="200">动作大格；强速度线和尘土，但不要遮住火把方向。</text>
<rect x="374" y="248" width="264" height="72" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="379" y="263">P010</text>
<text class="note" x="379" y="278">中大格；陈青源首次出场：国字脸、虬髯、中年江湖武人，不是官军。</text>
<rect x="385" y="326" width="242" height="48" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="390" y="341">P011</text>
<text class="note" x="390" y="356">误认关键格；姜月初内心慌但表情要压住。</text>
<rect x="385" y="381" width="242" height="48" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="390" y="396">P012</text>
<text class="note" x="390" y="411">反差格；脸必须精致稳定，表面冷、内心崩。</text>
