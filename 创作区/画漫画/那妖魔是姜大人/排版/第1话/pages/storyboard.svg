<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="16280" viewBox="0 0 1440 16280">
<rect width="100%" height="100%" fill="#f3f0e8"/>
<rect x="0" y="0" width="1440" height="11632" fill="#fbfaf7" stroke="#d4c8b4" stroke-width="2"/>
<text x="36" y="44" font-size="28" fill="#7a5a20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="36" dy="0">S001</tspan></text>
<rect x="72" y="28" width="1296" height="1040" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="76" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P001  opening_hook</tspan></text>
<text x="100" y="126" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">血色夕阳下的破败荒野，枯草连天，囚犯尸体与黑衣镇魔卫尸体散落，远处巨大的虎妖尸身倚在岩石旁。</tspan></text>
<text x="100" y="908" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：风里带着腥气。</tspan></text>
<rect x="120" y="72" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="106" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B001N</tspan><tspan x="136" dy="27">narration</tspan></text>
<rect x="72" y="1096" width="1296" height="700" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="1144" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P002  setup</tspan></text>
<text x="100" y="1194" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">姜月初从枯草和泥土中撑起身，灰白囚服沾满尘土，脸上茫然又惊惧。</tspan></text>
<text x="100" y="1636" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：姜月初还没能接受，自己穿越成了陌生女子。</tspan></text>
<rect x="120" y="1140" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="1174" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B002N</tspan><tspan x="136" dy="27">narration</tspan></text>
<rect x="72" y="1824" width="1296" height="840" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="1872" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P003  world_reveal</tspan></text>
<text x="100" y="1922" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">破碎记忆像碎片一样压入她脑海：大唐王朝、妖魔横行、罪臣之女、发配边疆。</tspan></text>
<text x="100" y="2504" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：大唐。妖魔。罪臣之女。发配边疆。</tspan></text>
<rect x="120" y="1868" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="1902" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B003N</tspan><tspan x="136" dy="27">narration</tspan></text>
<rect x="72" y="2692" width="1296" height="1040" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="2740" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P004  reveal</tspan></text>
<text x="100" y="2790" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">姜月初看见虎妖尸身，人身虎头、体魄如小山，胸膛有巨大血洞，黑色妖血流了一地。</tspan></text>
<text x="100" y="3572" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：是妖魔。还好……是死的。</tspan></text>
<rect x="120" y="2736" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="2770" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B004N</tspan><tspan x="136" dy="27">narration</tspan></text>
<rect x="72" y="3760" width="1296" height="760" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="3808" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P005  new_threat</tspan></text>
<text x="100" y="3858" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">半跪在地的裴长青以断刀支撑身体，黑衣赤纹，浑身是伤，抬眼看向姜月初。</tspan></text>
<text x="100" y="4360" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">裴长青：过来。</tspan></text>
<rect x="882" y="3804" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="3838" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B005D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="72" y="4548" width="1296" height="700" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="4596" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P006  reaction</tspan></text>
<text x="100" y="4646" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">姜月初悄然后退，眼神警惕，脚尖已经转向荒野深处。</tspan></text>
<text x="100" y="5088" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：她只想跑。没有户籍路引，也好过去边疆送死。</tspan></text>
<rect x="120" y="4592" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="4626" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B006N</tspan><tspan x="136" dy="27">narration</tspan></text>
<rect x="72" y="5276" width="1296" height="840" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="5324" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P007  action_beat</tspan></text>
<text x="100" y="5374" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">半截断刀破风飞来，钉在姜月初脚前半步，泥土碎溅。</tspan></text>
<text x="100" y="5956" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">SFX：咻 / 铮</tspan></text>
<rect x="540" y="5616" width="360" height="150" rx="28" fill="none" stroke="#b4433d" stroke-width="3" stroke-dasharray="10 8"/>
<text x="556" y="5650" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B007S</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="72" y="6144" width="1296" height="880" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="6192" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P008  bargain</tspan></text>
<text x="100" y="6242" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">裴长青半跪喘息，自报身份；姜月初僵硬回头，脸上写着不情愿。</tspan></text>
<text x="100" y="6864" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">裴长青：在下裴长青，陇右镇魔都司队正。 |</tspan><tspan x="100" dy="32">裴长青：按我说的做，我保你脱籍。</tspan></text>
<rect x="882" y="6188" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="6222" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B008D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="128" y="6342" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="144" y="6376" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="144" dy="0">B008D2</tspan><tspan x="144" dy="27">dialogue</tspan></text>
<rect x="72" y="7052" width="1296" height="740" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="7100" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P009  transition</tspan></text>
<text x="100" y="7150" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">姜月初吃力把裴长青右臂架到肩上，两人踉跄往南走，身后是虎妖尸体和满地残骸。</tspan></text>
<text x="100" y="7632" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">姜月初：往……往哪儿走？ | 裴长青：往南。</tspan></text>
<rect x="882" y="7096" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="7130" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B009D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="128" y="7250" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="144" y="7284" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="144" dy="0">B009D2</tspan><tspan x="144" dy="27">dialogue</tspan></text>
<rect x="72" y="7820" width="1296" height="1040" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="7868" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P010  turning_point</tspan></text>
<text x="100" y="7918" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">身后的虎妖尸体发出咳声，巨大虎爪从地面撑起，胸口血洞仍然狰狞。</tspan></text>
<text x="100" y="8700" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">虎妖：别跑了。 | SFX：咳 / 喀啦</tspan></text>
<rect x="882" y="7864" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="7898" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B010D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="540" y="8260" width="360" height="150" rx="28" fill="none" stroke="#b4433d" stroke-width="3" stroke-dasharray="10 8"/>
<text x="556" y="8294" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B010S</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="72" y="8888" width="1296" height="780" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="8936" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P011  reaction</tspan></text>
<text x="100" y="8986" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">姜月初手上一松，裴长青直挺挺摔在地上；两人都盯着复活的虎妖。</tspan></text>
<text x="100" y="9508" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：都说人死不能复生。可没人告诉她，妖死也不行。 | SFX：砰</tspan></text>
<rect x="120" y="8932" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="8966" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B011N</tspan><tspan x="136" dy="27">narration</tspan></text>
<rect x="540" y="9198" width="360" height="150" rx="28" fill="none" stroke="#b4433d" stroke-width="3" stroke-dasharray="10 8"/>
<text x="556" y="9232" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B011S</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="72" y="9696" width="1296" height="840" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="9744" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P012  exposition</tspan></text>
<text x="100" y="9794" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">虎妖扭动脖颈，居高临下俯视二人；裴长青脸色惨白，意识到它已接近鸣骨境。</tspan></text>
<text x="100" y="10376" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：此妖，已半只脚踏入鸣骨之境。 |</tspan><tspan x="100" dy="32">虎妖：真以为凭你们，便能杀我？</tspan></text>
<rect x="120" y="9740" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="9774" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B012N</tspan><tspan x="136" dy="27">narration</tspan></text>
<rect x="882" y="9878" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="9912" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B012D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="72" y="10564" width="1296" height="1040" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="10612" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P013  action_peak</tspan></text>
<text x="100" y="10662" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">裴长青强行捡起横刀扑上，刀光劈向虎妖脖颈；虎妖一脚后发先至，把他踹飞。</tspan></text>
<text x="100" y="11444" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">裴长青：死！ | SFX：轰 / 砰</tspan></text>
<rect x="882" y="10608" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="10642" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B013D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="540" y="11004" width="360" height="150" rx="28" fill="none" stroke="#b4433d" stroke-width="3" stroke-dasharray="10 8"/>
<text x="556" y="11038" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B013S</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="0" y="11712" width="1440" height="4568" fill="#fbfaf7" stroke="#d4c8b4" stroke-width="2"/>
<text x="36" y="11756" font-size="28" fill="#7a5a20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="36" dy="0">S002</tspan></text>
<rect x="72" y="11740" width="1296" height="840" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="11788" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P014  system_reveal</tspan></text>
<text x="100" y="11838" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">姜月初跌坐在地，虎妖步步逼近；她眼前忽然展开古朴绘卷，金色字迹浮现。</tspan></text>
<text x="100" y="12420" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：就在她彻底绝望之际，一副古朴绘卷徐徐展开。</tspan></text>
<rect x="120" y="11784" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="11818" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B014N</tspan><tspan x="136" dy="27">narration</tspan></text>
<rect x="72" y="12608" width="1296" height="840" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="12656" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P015  system_info</tspan></text>
<text x="100" y="12706" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">百妖谱绘卷特写，金色字迹列出宿主、凡境、武学无、道行零，以及斩杀生物可获得道行的规则。</tspan></text>
<text x="100" y="13288" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：斩杀生物，可获得对应道行。</tspan></text>
<rect x="120" y="12652" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="12686" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B015N</tspan><tspan x="136" dy="27">narration</tspan></text>
<rect x="72" y="13476" width="1296" height="840" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="13524" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P016  decision_pressure</tspan></text>
<text x="100" y="13574" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">姜月初握住掉落的横刀，低头发抖；虎妖在前方逼近，裴长青奄奄一息躺在她脚边。</tspan></text>
<text x="100" y="14156" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：荒野之上，除了杀不死的虎妖，唯一还活着的生物……</tspan></text>
<rect x="120" y="13520" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
