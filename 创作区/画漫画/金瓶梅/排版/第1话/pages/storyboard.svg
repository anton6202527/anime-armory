<text x="100" y="15627" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">超长收束格。锣鼓声化为清河县叫卖声；武大挑炊饼担穿过暖赭街巷，画面上方武大家门帘微动，成年潘金莲只露克制侧影与注视街面的眼神。街角一抹华服背影作为未来欲望网络的非具名伏笔。</tspan></text>
