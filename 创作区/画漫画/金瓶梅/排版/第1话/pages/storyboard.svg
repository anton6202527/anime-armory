<text x="100" y="10262" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">武松左手揪颈背皮毛、右臂压头，膝与脚形成三角支点；虎前爪抓地。</tspan></text>
<text x="100" y="11044" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">武松：喝！ | SFX：轰</tspan></text>
