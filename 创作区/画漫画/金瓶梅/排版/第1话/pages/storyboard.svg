<text x="154" y="9234" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">断棒落地近景；武松沉肩张手，虎影覆盖他半身。</tspan></text>
<text x="154" y="9976" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">旁白：退无可退。 | SFX：当</tspan></text>
