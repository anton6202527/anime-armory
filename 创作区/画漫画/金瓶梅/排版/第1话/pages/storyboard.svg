<text x="154" y="12506" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">武松倚树喘息，断棒在脚边；三名猎户持叉停在远处，目光越过他看向伏虎。</tspan></text>
<text x="154" y="13088" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">猎户：真……真是你一人打死的？</tspan></text>
