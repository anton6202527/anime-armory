<text x="100" y="11330" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">最大竖格。俯斜视角，武松一拳落下，尘土与松针向外震开；虎势已衰，远山留白。</tspan></text>
<text x="100" y="12112" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">SFX：咚！ / 咚！</tspan></text>
