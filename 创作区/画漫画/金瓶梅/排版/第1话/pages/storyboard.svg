<text x="154" y="4238" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">虎以前掌横掀，武松贴地侧滚，哨棒横护胸前。</tspan></text>
<text x="154" y="4980" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">旁白：一掀。 | SFX：唰！</tspan></text>
