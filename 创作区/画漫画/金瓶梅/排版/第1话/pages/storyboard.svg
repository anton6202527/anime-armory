<text x="100" y="3040" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P004  return_to_attack</tspan></text>
<text x="100" y="3090" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">虎腹掠过近景，武松仰身滑过爪下；断枝和落叶标出轨迹。</tspan></text>
<text x="100" y="3952" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：一扑。 | SFX：呼——</tspan></text>
