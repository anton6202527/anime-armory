<text x="154" y="2092" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">P003  choice</tspan></text>
<text x="154" y="2142" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">武松放下铜钱、提棒出门；门外暮色山路斜向上。</tspan></text>
<text x="154" y="2804" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">武松：酒钱照付，冈也照过。 | SFX：笃</tspan></text>
