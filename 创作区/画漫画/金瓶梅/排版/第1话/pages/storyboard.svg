<text x="154" y="5266" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">虎尾如鞭扫断细枝；武松后跃，脚跟踩上湿石。</tspan></text>
<text x="154" y="6008" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">旁白：一剪。 | SFX：啪——！</tspan></text>
