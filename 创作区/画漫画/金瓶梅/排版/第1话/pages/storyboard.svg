<text x="100" y="13374" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">长纵景。猎户和乡民抬虎下冈，武松被簇拥在队伍中央；山路蜿蜒进入暖色县城方向。</tspan></text>
<text x="100" y="14313" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：众人拥他下冈。 | SFX：打虎英雄！</tspan></text>
