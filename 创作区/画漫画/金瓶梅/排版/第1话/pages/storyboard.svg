<text x="154" y="14599" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">朱砂点色的县衙告示与都头腰牌近景；武松双手接牌，围观者虚化。</tspan></text>
<text x="154" y="15341" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">旁白：阳谷知县：任武松为都头。 | SFX：锵</tspan></text>
