<text x="100" y="8166" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">全宽冲击格。哨棒砸中枯树中央断裂，木屑飞散；虎从画面下方重新逼近。</tspan></text>
<text x="100" y="8948" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">SFX：喀嚓！</tspan></text>
