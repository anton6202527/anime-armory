<text x="154" y="1194" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">暖赭酒肆。粗陶碗前景，店家伸手拦酒，武松侧目。</tspan></text>
<text x="154" y="1856" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">旁白：一刻前。 | 店家：三碗不过冈。客官，莫再饮了。</tspan></text>
<rect x="174" y="1144" width="430" height="88" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="190" y="1178" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="190" dy="0">B002N1</tspan><tspan x="190" dy="27">narration</tspan></text>
