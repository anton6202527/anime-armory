<text x="154" y="7298" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">武松双手举棒，自上而下猛劈；虎压低前身。</tspan></text>
<text x="154" y="7880" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="154" dy="0">武松：着！</tspan></text>
