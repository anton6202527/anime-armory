<text class="pid" x="62" y="155">P002</text>
<text class="note" x="62" y="170">暖赭酒肆。粗陶碗前景，店家伸手拦酒，武松侧目。</text>
<rect x="57" y="194" width="242" height="48" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="62" y="209">P003</text>
<text class="note" x="62" y="224">武松放下铜钱、提棒出门；门外暮色山路斜向上。</text>
<rect x="46" y="248" width="264" height="72" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="51" y="263">P004</text>
<text class="note" x="51" y="278">虎腹掠过近景，武松仰身滑过爪下；断枝和落叶标出轨迹。</text>
<rect x="57" y="326" width="242" height="48" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="62" y="341">P005</text>
<text class="note" x="62" y="356">虎以前掌横掀，武松贴地侧滚，哨棒横护胸前。</text>
<rect x="57" y="381" width="242" height="48" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="62" y="396">P006</text>
<text class="note" x="62" y="411">虎尾如鞭扫断细枝；武松后跃，脚跟踩上湿石。</text>
