<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="486" viewBox="0 0 1012 486">
<rect width="100%" height="100%" fill="#f2efe7"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;font-size:11px;fill:#222}.pid{font-weight:700}.note{font-size:9px;fill:#555}</style>
<rect x="28" y="28" width="300" height="430" fill="#fffdf7" stroke="#222" stroke-width="2"/>
<text x="38" y="46">SCROLL_001 scroll</text>
<rect x="46" y="62" width="264" height="78" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="51" y="77">P001</text>
<text class="note" x="51" y="92">无字原图只留低细节雾面给旁白；不要画人、床或裸露。</text>
<rect x="57" y="146" width="242" height="51" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="62" y="161">P002</text>
<text class="note" x="62" y="176">不要展开历史人物；只画乱世气氛和兄弟反差。</text>
<rect x="57" y="204" width="242" height="51" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="62" y="219">P003</text>
<text class="note" x="62" y="234">榜文不生成可读长字，只画官府告示块。</text>
<rect x="68" y="262" width="220" height="26" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="73" y="277">P004</text>
<text class="note" x="73" y="281">武松不看镜头，动作是迈步离开。</text>
<rect x="46" y="294" width="264" height="78" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="51" y="309">P005</text>
<text class="note" x="51" y="324">大格，虎不要魔化；不画过度血腥。</text>
<rect x="57" y="378" width="242" height="51" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="62" y="393">P006</text>
<text class="note" x="62" y="408">动作分层但不是拼贴多格；用速度线解释三招。</text>
<text class="note" x="38" y="448">hook: P005 monster_reveal</text>
<rect x="356" y="28" width="300" height="430" fill="#fffdf7" stroke="#222" stroke-width="2"/>
<text x="366" y="46">SCROLL_002 scroll</text>
<rect x="385" y="62" width="242" height="44" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="390" y="77">P007</text>
<text class="note" x="390" y="92">不要把断棒画成刀剑；木质断口清楚。</text>
<rect x="374" y="112" width="264" height="67" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="379" y="127">P008</text>
<text class="note" x="379" y="142">动作有重量，不画内脏；血只少量泥血点。</text>
<rect x="385" y="186" width="242" height="44" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="390" y="201">P009</text>
<text class="note" x="390" y="216">群像不要生成现代猎装；火把少量暖光。</text>
<rect x="374" y="237" width="264" height="67" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="379" y="252">P010</text>
<text class="note" x="379" y="267">不要把县衙画成皇宫；官牌/银两清楚。</text>
<rect x="385" y="310" width="242" height="44" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="390" y="325">P011</text>
<text class="note" x="390" y="340">不要过度丑化武大；重点是街巷压力。</text>
<rect x="374" y="361" width="264" height="68" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="379" y="376">P012</text>
<text class="note" x="379" y="391">禁止裸露、床、性行为；以门帘和影子表现压迫。</text>
<text class="note" x="366" y="448">hook: P010 status_turn</text>
<rect x="684" y="28" width="300" height="430" fill="#fffdf7" stroke="#222" stroke-width="2"/>
<text x="694" y="46">SCROLL_003 scroll</text>
<rect x="713" y="62" width="242" height="48" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="718" y="77">P013</text>
<text class="note" x="718" y="92">不画裸露，不突出身体部位；表情和环境承担欲望线。</text>
<rect x="713" y="116" width="242" height="48" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="718" y="131">P014</text>
<text class="note" x="718" y="146">仪仗不画成皇家队伍；武松是地方都头。</text>
<rect x="713" y="170" width="242" height="48" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="718" y="185">P015</text>
<text class="note" x="718" y="200">兄弟情要真，不把武大画成笑料。</text>
<rect x="702" y="224" width="264" height="72" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="707" y="239">P016</text>
<text class="note" x="707" y="254">潘金莲不露骨；武松不看读者也不直勾勾看潘金莲。</text>
<rect x="713" y="302" width="242" height="48" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="718" y="317">P017</text>
<text class="note" x="718" y="332">眼神张力，不画身体挑逗；武松守礼。</text>
<rect x="702" y="357" width="264" height="72" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="707" y="372">P018</text>
<text class="note" x="707" y="387">收在红帘和背影，不画直白欲望动作。</text>
<text class="note" x="694" y="448">hook: P018 cliffhanger</text>
</svg>
