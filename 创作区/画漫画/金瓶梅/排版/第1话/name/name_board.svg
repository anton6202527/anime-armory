<text class="pid" x="390" y="263">P010</text>
<text class="note" x="390" y="278">断棒落地近景；武松沉肩张手，虎影覆盖他半身。</text>
<rect x="374" y="297" width="264" height="63" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="379" y="312">P011</text>
<text class="note" x="379" y="327">武松左手揪颈背皮毛、右臂压头，膝与脚形成三角支点；虎前爪抓地。</text>
