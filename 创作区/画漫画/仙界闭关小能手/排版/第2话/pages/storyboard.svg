<text x="100" y="14594" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">近景：破盆里只有半盆不到的低阶灵米，贺平生的手停在盆沿，眼神安静地看出分量不对。</tspan></text>
<text x="100" y="15376" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：哪有十斤？最多五斤。</tspan></text>
