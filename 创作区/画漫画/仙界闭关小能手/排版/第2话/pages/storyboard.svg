<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="16632" viewBox="0 0 1440 16632">
<rect width="100%" height="100%" fill="#f3f0e8"/>
<rect x="0" y="0" width="1440" height="16632" fill="#fbfaf7" stroke="#d4c8b4" stroke-width="2"/>
<text x="36" y="44" font-size="28" fill="#7a5a20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="36" dy="0">S001</tspan></text>
<rect x="72" y="28" width="1296" height="1000" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="76" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P001  night_water_finish</tspan></text>
<text x="100" y="126" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">深夜的杂役院水缸旁，贺平生把最后两桶水倒进巨大水缸，水面只到刚过一半，少年肩膀被扁担压得发红。</tspan></text>
<text x="100" y="868" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：今日第五趟，水缸才刚过一半。 | SFX：哗啦</tspan></text>
<rect x="120" y="72" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="106" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B001N</tspan><tspan x="136" dy="27">narration</tspan></text>
<rect x="540" y="448" width="360" height="150" rx="28" fill="none" stroke="#b4433d" stroke-width="3" stroke-dasharray="10 8"/>
<text x="556" y="482" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B001S</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="72" y="1056" width="1296" height="840" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="1104" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P002  wash_basin</tspan></text>
<text x="100" y="1154" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">简陋空房里，贺平生蹲在桌边仔细擦洗黑旧破陶盆，盆里只留半盆清水，铁碗放在一旁。</tspan></text>
<text x="100" y="1736" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">贺平生：留半盆水，夜里也不用再跑。</tspan></text>
<rect x="882" y="1100" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="1134" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B002D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="72" y="1924" width="1296" height="780" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="1972" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P003  sleep_transition</tspan></text>
<text x="100" y="2022" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">贺平生关上木门、插上门闩，月光从窗格斜照进屋，破盆静静放在靠窗桌面上。</tspan></text>
<text x="100" y="2544" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：月光透窗，他几乎倒头就睡。 | SFX：咔</tspan></text>
<rect x="120" y="1968" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="2002" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B003N</tspan><tspan x="136" dy="27">narration</tspan></text>
<rect x="540" y="2234" width="360" height="150" rx="28" fill="none" stroke="#b4433d" stroke-width="3" stroke-dasharray="10 8"/>
<text x="556" y="2268" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B003S</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="72" y="2732" width="1296" height="920" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="2780" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P004  morning_canteen</tspan></text>
<text x="100" y="2830" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">清晨铜锣声中，杂役们端着铁碗涌向食堂，贺平生夹在队伍里，眼下带着疲惫。</tspan></text>
<text x="100" y="3492" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">SFX：当当</tspan></text>
<rect x="540" y="3112" width="360" height="150" rx="28" fill="none" stroke="#b4433d" stroke-width="3" stroke-dasharray="10 8"/>
<text x="556" y="3146" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B004S</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="72" y="3680" width="1296" height="960" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="3728" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P005  breakfast_reward</tspan></text>
<text x="100" y="3778" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">食堂窗口前，粗壮油污的张老大侧身数人，抬手示意厨子老鲍给贺平生多打肉。</tspan></text>
<text x="100" y="4480" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">张老大：老鲍，给这小子多打点肉。</tspan></text>
<rect x="882" y="3724" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="3758" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B005D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="72" y="4668" width="1296" height="840" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="4716" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P006  breakfast</tspan></text>
<text x="100" y="4766" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">铁碗里热饭和肉块被勺子盛满，贺平生双手捧碗，低头向张老大道谢。</tspan></text>
<text x="100" y="5348" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">贺平生：谢谢张老大。 | SFX：铛</tspan></text>
<rect x="882" y="4712" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="4746" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B006D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="540" y="5008" width="360" height="150" rx="28" fill="none" stroke="#b4433d" stroke-width="3" stroke-dasharray="10 8"/>
<text x="556" y="5042" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B006S</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="72" y="5536" width="1296" height="960" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="5584" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P007  green_water_reveal</tspan></text>
<text x="100" y="5634" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">贺平生回到空房，猛地停在门口：昨夜半盆清水的破陶盆，如今竟变成了满满一盆浑绿的水。</tspan></text>

<rect x="72" y="6524" width="1296" height="700" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="6572" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P008  spoilage_question</tspan></text>
<text x="100" y="6622" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">近景特写：黑旧破盆里的绿水微微晃动，水色像变质的草药汁，盆沿缺口和泥痕清楚。</tspan></text>
<text x="100" y="7064" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">贺平生：真是奇怪了……水都变质了吗？ | SFX：咕</tspan></text>
<rect x="882" y="6568" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="6602" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B008D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="540" y="6794" width="360" height="150" rx="28" fill="none" stroke="#b4433d" stroke-width="3" stroke-dasharray="10 8"/>
<text x="556" y="6828" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B008S</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="72" y="7252" width="1296" height="700" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="7300" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P009  spoilage_decision</tspan></text>
<text x="100" y="7350" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">贺平生把绿水从破盆里倒向屋外泥地，水流落下，少年眉头微皱，动作谨慎。</tspan></text>
<text x="100" y="7792" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">贺平生：以后不能用这盆子盛水了。 | SFX：哗</tspan></text>
<rect x="882" y="7296" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="7330" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B009D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="540" y="7522" width="360" height="150" rx="28" fill="none" stroke="#b4433d" stroke-width="3" stroke-dasharray="10 8"/>
<text x="556" y="7556" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B009S</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="72" y="7980" width="1296" height="1040" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="8028" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P010  labor_montage</tspan></text>
<text x="100" y="8078" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">一条竖向蒙太奇：贺平生从晨到夜反复挑水，山路、瀑布、水缸、肩头红痕连续出现。</tspan></text>
<text x="100" y="8860" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：昨日垫了五趟，今日仍跑到深夜。</tspan></text>
<rect x="120" y="8024" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="8058" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B010N</tspan><tspan x="136" dy="27">narration</tspan></text>
<rect x="72" y="9048" width="1296" height="620" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="9096" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P011  night_worry</tspan></text>
<text x="100" y="9146" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">深夜房间里，贺平生坐在床沿脱力垂肩，肩头勒痕明显，空水桶靠在墙边。</tspan></text>
<text x="100" y="9508" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">贺平生：明日二十趟，可怎么挑？</tspan></text>
<rect x="882" y="9092" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="9126" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B011D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="72" y="9696" width="1296" height="1040" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="9744" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P012  door_knock</tspan></text>
<text x="100" y="9794" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">门外突然响起沉重敲门声，门缝透进一道人影，屋内贺平生警觉抬头。</tspan></text>
<text x="100" y="10576" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">张老大：贺平生，开门。 | SFX：砰砰砰</tspan></text>
<rect x="882" y="9740" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="9774" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B012D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="540" y="10136" width="360" height="150" rx="28" fill="none" stroke="#b4433d" stroke-width="3" stroke-dasharray="10 8"/>
<text x="556" y="10170" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B012S</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="72" y="10764" width="1296" height="960" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="10812" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P013  zhang_visit</tspan></text>
<text x="100" y="10862" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">张老大拎着沉甸甸布袋进屋，脸上带假笑，贺平生站在一旁恭敬回应。</tspan></text>
<text x="100" y="11564" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">张老大：平生啊，今儿累不累？ | 贺平生：有点累。</tspan></text>
<rect x="882" y="10808" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="10842" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B013D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="128" y="10962" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="144" y="10996" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="144" dy="0">B013D2</tspan><tspan x="144" dy="27">dialogue</tspan></text>
<rect x="72" y="11752" width="1296" height="920" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="11800" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P014  rice_allocation</tspan></text>
<text x="100" y="11850" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">张老大把布袋口解开，里面露出带淡淡青白光泽的低阶灵米，贺平生的目光落在米袋上。</tspan></text>
<text x="100" y="12512" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">张老大：这是灵米。你每月十斤。 | SFX：沙</tspan></text>
<rect x="882" y="11796" width="430" height="136" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="898" y="11830" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="898" dy="0">B014D1</tspan><tspan x="898" dy="27">dialogue</tspan></text>
<rect x="540" y="12132" width="360" height="150" rx="28" fill="none" stroke="#b4433d" stroke-width="3" stroke-dasharray="10 8"/>
<text x="556" y="12166" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B014S</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="72" y="12700" width="1296" height="700" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="12748" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P015  empty_room_choice</tspan></text>
<text x="100" y="12798" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">贺平生环顾空房，屋里除铁碗、床板和那个黑旧破盆外没有可装米的容器。</tspan></text>
<text x="100" y="13240" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：屋里空得只剩一个破盆能装东西。</tspan></text>
<rect x="120" y="12744" width="560" height="118" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="12778" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B015N</tspan><tspan x="136" dy="27">narration</tspan></text>
<rect x="72" y="13428" width="1296" height="1040" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="13476" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P016  spirit_rice_pour</tspan></text>
<text x="100" y="13526" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">张老大把一小袋灵米倒进黑旧破盆，白绿米粒像细流落下，盆身缺口在月光下清楚可见。</tspan></text>
<text x="100" y="14308" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">SFX：哗啦啦</tspan></text>
<rect x="540" y="13868" width="360" height="150" rx="28" fill="none" stroke="#b4433d" stroke-width="3" stroke-dasharray="10 8"/>
<text x="556" y="13902" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B016S</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="72" y="14496" width="1296" height="1040" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
