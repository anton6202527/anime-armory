<text x="100" y="15662" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">夜深，贺平生躺在简陋床上闭眼忍下不甘，桌边破盆盛着灵米，被窗外月光照出一圈安静冷亮。</tspan></text>
<text x="100" y="16444" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：知道被克扣，他也只能先睡。</tspan></text>
