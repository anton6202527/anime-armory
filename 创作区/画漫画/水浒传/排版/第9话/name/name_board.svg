<rect x="68" y="978" width="220" height="33" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="73" y="993">P037</text>
<text class="note" x="73" y="1004">崎岖山岭与寂寞孤村之间，史进提朴刀走在蜿蜒小路上。</text>
<rect x="68" y="1017" width="220" height="33" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="73" y="1032">P038</text>
<text class="note" x="73" y="1043">夜宿荒林，冷雾穿树，史进靠树抱刀浅眠。</text>
<rect x="68" y="1057" width="220" height="33" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="73" y="1072">P039</text>
<text class="note" x="73" y="1083">晓月未落，史进已经踏上结霜山道，远村传来鸡鸣。</text>
<rect x="46" y="1097" width="264" height="101" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="51" y="1112">P040</text>
<text class="note" x="51" y="1127">日落、犬吠与磨损麻鞋构成半月行旅蒙太奇，史进更显风尘。</text>
<rect x="57" y="1204" width="242" height="67" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="62" y="1219">P041</text>
<text class="note" x="62" y="1234">渭州城门与六街三市展开，史进在人流中抬头寻找经略府。</text>
<rect x="57" y="1278" width="242" height="67" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="62" y="1293">P042</text>
<text class="note" x="62" y="1308">路口小茶坊内，史进放下朴刀与包裹，接过一碗泡茶。</text>
<text class="note" x="38" y="1364">hook: P042 reentry</text>
