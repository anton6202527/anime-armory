<text class="pid" x="390" y="993">P043</text>
<text class="note" x="390" y="1008">史进向茶博士询问东京来的王教头，手指经略府方向。</text>
<rect x="385" y="1028" width="242" height="44" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="390" y="1043">P044</text>
<text class="note" x="390" y="1058">茶博士摊手，身后街口人影来往，史进神色落空。</text>
<rect x="374" y="1079" width="264" height="67" fill="#ece8dc" stroke="#333" stroke-width="1.5"/>
<text class="pid" x="379" y="1094">P045</text>
<text class="note" x="379" y="1109">茶坊门帘猛然掀开，一个高大军官大踏步进入，史进回头。</text>
