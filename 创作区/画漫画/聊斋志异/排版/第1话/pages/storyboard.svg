<text x="556" y="15876" font-size="20" fill="#b4433d" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="556" dy="0">B015S2</tspan><tspan x="556" dy="27">sfx</tspan></text>
<rect x="72" y="16096" width="1296" height="1040" rx="8" fill="#e5e0d8" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="16144" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P016  epilogue</tspan></text>
<text x="100" y="16194" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">数日后的书斋近景，王生坐在床沿接开素青长衫，腹部只露出一枚如古钱大小的圆形疤痕；他的手指停在疤痕边缘却不敢按下。后景纸窗后，陈氏的背影正把洗净的血污布带挂起，两人之间被窗格分开。</tspan></text>
<text x="100" y="16976" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：明明妖也，而以为美。明明忠也，而以为妄。</tspan></text>
<rect x="120" y="16144" width="430" height="88" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
