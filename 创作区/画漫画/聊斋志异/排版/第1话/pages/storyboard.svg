<rect x="72" y="15000" width="1296" height="1040" rx="8" fill="#eee7dc" stroke="#1f1f1f" stroke-width="4"/>
<text x="100" y="15048" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P015  payoff</tspan></text>
<text x="100" y="15098" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">拂晓书斋，纸窗由深蓝转为灰白，陈氏伏在床边熟睡，一只手仍覆在王生腹部绷带上；她另一只手的食指停在王生鼻下，感到一缕微弱呼气，王生胸口稍微起伏。</tspan></text>
<text x="100" y="15880" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">陈氏： | SFX：呼——</tspan></text>
<rect x="120" y="15048" width="430" height="88" rx="28" fill="none" stroke="#3d72b4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="136" y="15082" font-size="20" fill="#3d72b4" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="136" dy="0">B015D1</tspan><tspan x="136" dy="27">dialogue</tspan></text>
