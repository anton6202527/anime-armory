<text x="100" y="14332" font-size="30" fill="#111111" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">P015  payoff</tspan></text>
<text x="100" y="14382" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">长竖格上半，贾家床上母亲侧卧安睡，眉眼恢复平静，贾儿在床边轻触被角；下半以撕裂式黑场转到何氏园，父子提灯看见亭边两只赤狐和草中一只秃尾赤狐静止倒卧，旁有未尽酒壶。</tspan></text>
<text x="100" y="15212" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">贾儿：娘终于睡着了。 | SFX：呼……</tspan></text>
