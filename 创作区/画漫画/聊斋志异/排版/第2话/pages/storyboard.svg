<text x="100" y="15526" font-size="26" fill="#333333" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">清晨何氏园月门外，父亲蹲下与贾儿平视，一手按在孩子肩上；贾儿已摘下假尾卷在手里。远处留白中以淡墨叠出成年后的骑射剪影，不画具体官服纹章。</tspan></text>
<text x="100" y="16428" font-size="24" fill="#5b2b20" font-family="PingFang SC, Heiti SC, sans-serif"><tspan x="100" dy="0">旁白：后来，他果然成了将军。 | 贾儿：此物最灵，一泄便知。 |</tspan><tspan x="100" dy="32">贾父：我儿，真是讨狐的小陈平。</tspan></text>
